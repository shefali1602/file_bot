<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inquiro - File Assistant</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header class="header">
        <div class="header-left">
            <img src="/static/logo-placeholder.png" alt="Company Logo" class="logo">
        </div>
        <div class="header-center">
            <h1>Inquiro</h1>
        </div>
        <div class="header-right">
            <button class="header-button" onclick="exitChat()">Exit</button>
            <button class="header-button" onclick="resetChat()">Reset</button>
        </div>
    </header>

    <main class="chat-container">
        <div id="chatbox" class="chat-box"></div>
    </main>

    <footer class="input-container">
        <input type="text" id="user-input" placeholder="Type your message...">
        <button onclick="sendMessage()">Send</button>
    </footer>

    <div class="disclaimer">
        <em>Inquiro can make mistakes. Always verify information.</em>
    </div>
    

    <script src="/static/script.js"></script>
</body>
</html>
